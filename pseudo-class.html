  1. Tombol harus berubah warna background-nya saat kursor berada di atasnya (hover).
  2. Input teks harus berubah warna garis pinggirnya (border) atau menyala saat sedang diklik/diketik (focus).

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Latihan Pseudo-Classes Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-8 space-y-6 max-w-md mx-auto">
    <h1 class="text-xl font-bold text-gray-800">Formulir Interaktif</h1>

    <!-- Tambahkan pseudo-class focus pada input ini -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Nama Lengkap</label
      >
      <input
        type="text"
        placeholder="Ketik nama kamu di sini..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:border-red-500" />
    </div>

    <!-- Tambahkan pseudo-class hover dan active pada tombol ini -->
    <div>
      <button
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium py-2 rounded-lg">
        Kirim Data
      </button>
    </div>
  </body>
</html>

<!-- Note: 
  1. Penulisan kode / sintaks yang digunakan: hover:bg-indigo-700 active:bg-indigo-800 focus:border-red-500
  2. Kesimpulan / Alasan: pseudo class berfungsi untuk memberi variant, untuk komponen tertentu
-->
