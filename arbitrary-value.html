  di dalam tag, ubah elemen-elemen di bawah ini agar menggunakan ukuran, warna, atau posisi kustom 
  yang spesifik (misalnya: lebar 327px, warna teks #ff5733, atau padding 18px).

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Latihan Arbitrary Values Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-8 space-y-4">
    <!-- Kotak ini harus memiliki lebar persis 342px dan warna background #2b2d42 -->
    <div
      class="w-[342px] bg-[#2b2d42] h-24 rounded-lg flex items-center justify-center text-white font-medium">
      Kotak Ukuran Kustom
    </div>

    <!-- Teks ini harus memiliki ukuran font persis 27px dan warna #ef233c -->
    <p class="text-[27px] text-[#ef233c]">
      Ini adalah teks dengan ukuran dan warna yang tidak ada di skala bawaan
      Tailwind.
    </p>

    <!-- Tombol ini harus memiliki margin-left persis 42.5px -->
    <button class="ml-[42.5px] bg-indigo-600 text-white px-4 py-2 rounded-lg">
      Tombol Geser
    </button>
  </body>
</html>

<!-- Note: 
  1. Penulisan kode / sintaks yang digunakan: [...] arbitrary value
  2. Kesimpulan / Alasan: arbitrary value, mampu membuat kita memberi angka spesifik dalam suatu obyek
-->
